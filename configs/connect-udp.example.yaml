mode: connect-udp
listen: 127.0.0.1:4433
public_authority: proxy.example.com:443
tls:
  cert: /etc/jiejie-masque/connect-udp/fullchain.pem
  key: /etc/jiejie-masque/connect-udp/private.key
auth:
  allow_unauthenticated: false
  users:
    - username: example-client
      password_env: JIEJIE_MASQUE_EXAMPLE_PASSWORD
target_policy:
  # Standard CONNECT/CONNECT-UDP may only reach public destinations by default.
  allow_private: false
limits:
  max_active_flows: 256
  max_active_flows_per_user: 64
  flow_idle_timeout: 1h
quic:
  keep_alive_period: 15s
  max_idle_timeout: 2m
  stateless_reset_key_file: /var/lib/jiejie-masque-connect-udp/stateless-reset.key
