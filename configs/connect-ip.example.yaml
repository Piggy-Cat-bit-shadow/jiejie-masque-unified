mode: connect-ip
listen: 127.0.0.1:4434
diagnostics:
  qlog:
    enabled: false
    directory: /var/log/jiejie-masque/qlog
tls:
  # Generated with: jiejie-masque server-keygen --cert /etc/jiejie-masque/connect-ip/server.crt --key /etc/jiejie-masque/connect-ip/server.key
  # Must be an independent P-256 ECDSA certificate, not a wildcard certificate.
  cert: /etc/jiejie-masque/connect-ip/server.crt
  key: /etc/jiejie-masque/connect-ip/server.key
quic:
  stateless_reset_key_file: /var/lib/jiejie-masque-connect-ip/stateless-reset.key
  # Field-tested WAN starting point. "default" remains the library fallback;
  # cubic selects the native non-Reno CUBIC sender before data streams begin.
  congestion_controller: cubic
host_network:
  # Optional; otherwise the default-route interface is detected.
  external_interface: eth0
  check_interval: 30s
client:
  # Example-only public key; replace it with the client's raw P-256 public key.
  public_keys: [BIU3CobtJ5y6P+wvKc7M1XBfS5FhcvLeVkPhObW4s5QY4UvNYuKxtYrZF+4eCxv2AW4OmvowLmN1v6CQVsJ+f9M=]
  tunnel_ipv4: 10.200.0.2/32
  # Optional dual-stack address. It must be an IPv6 /128 inside server.tunnel_ipv6.
  # tunnel_ipv6: fd00:200::2/128
# For multiple devices, replace the legacy client block with:
# clients:
#   - name: iphone
#     public_keys: [KEY_DEVICE_A]
#     tunnel_ipv4: 10.200.0.2/32
#   - name: mac
#     public_keys: [KEY_DEVICE_B]
#     tunnel_ipv4: 10.200.0.3/32
server:
  tunnel_ipv4: 10.200.0.1/16
  # Optional IPv6 tunnel network. Omit it for IPv4-only deployments.
  # tunnel_ipv6: fd00:200::1/64
  mtu: 1280
  # Optional Linux IFF_VNET_HDR RX GSO split path. Keep disabled until tested.
  tun_offload: false
  tun_tx_gro: false
  # 1024 packets is about 1.25 MiB at MTU 1280. It covers more of a typical
  # high-RTT WAN BDP without making memory unbounded; validate per deployment.
  outbound_queue_size: 1024
  session_idle_timeout: 1h
  session_nat:
    enabled: true
    pool: 10.200.128.0/17
    max_sessions: 120
    max_sessions_per_client: 32
    reuse_delay: 30m
# IPv6 cannot currently be combined with server.session_nat. Disable it for
# the single-session or dual-stack mode.
dns_gateway:
  enabled: true
  port: 5353
  upstream: 127.0.0.1:53
  timeout: 5s
  concurrency: 32
# For legacy single-session compatibility only, disable session_nat and use:
# server:
#   tunnel_ipv4: 10.200.0.1/30
#   mtu: 1280
