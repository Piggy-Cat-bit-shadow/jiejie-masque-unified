listen: 127.0.0.1:4434
tls:
  # Generated with: jiejie-masque server-keygen --cert /etc/jiejie-masque/connect-ip/server.crt --key /etc/jiejie-masque/connect-ip/server.key
  # Must be an independent P-256 ECDSA certificate, not a wildcard certificate.
  cert: /etc/jiejie-masque/connect-ip/server.crt
  key: /etc/jiejie-masque/connect-ip/server.key
quic:
  stateless_reset_key_file: /var/lib/jiejie-masque-connect-ip/stateless-reset.key
  # default preserves the pinned MetaCubeX/quic-go behavior; cubic selects its
  # native CUBIC sender before CONNECT-IP data-plane streams begin.
  congestion_controller: default
host_network:
  # Optional; otherwise the default-route interface is detected.
  external_interface: eth0
  check_interval: 10s
client:
  public_keys: []
  tunnel_ipv4: 10.200.0.2/32
# For multiple devices, replace the legacy client block with:
# clients:
#   - name: iphone
#     public_keys: [KEY_DEVICE_A]
#     tunnel_ipv4: 10.200.0.2/32
#   - name: mac
#     public_keys: [KEY_DEVICE_B]
#     tunnel_ipv4: 10.200.0.3/32
server:
  tunnel_ipv4: 10.200.0.1/16
  mtu: 1280
  # Optional Linux IFF_VNET_HDR RX GSO split path. Keep disabled until tested.
  tun_offload: false
  tun_tx_gro: false
  # 256 packets absorbs a scheduling burst while bounding per-session latency
  # and memory (about 320 KiB at MTU 1280).
  outbound_queue_size: 256
  session_idle_timeout: 1h
  session_nat:
    enabled: true
    pool: 10.200.128.0/17
    max_sessions: 120
    reuse_delay: 30m
dns_gateway:
  enabled: true
  port: 5353
  upstream: 127.0.0.1:53
  timeout: 5s
  concurrency: 32
# For legacy single-session compatibility only, disable session_nat and use:
# server:
#   tunnel_ipv4: 10.200.0.1/30
#   mtu: 1280
