name: unified-build

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Module tidy check
        run: go mod tidy -diff

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Dependency check
        run: scripts/verify-deps.sh

      - name: Shell check
        run: |
          bash -n scripts/verify-deps.sh
          sh -n contrib/jiejie-masque-connect-ip-network-prepare

      - name: Build Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o dist/jiejie-masque-linux-amd64 ./cmd/jiejie-masque

      - name: Release binary gates
        run: |
          bytes=$(stat -c '%s' dist/jiejie-masque-linux-amd64)
          echo "release_size_bytes=$bytes" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/jiejie-masque-linux-amd64
          file dist/jiejie-masque-linux-amd64
          readelf -S dist/jiejie-masque-linux-amd64 | grep -E '\.debug_|\.symtab[[:space:]]' && exit 1 || true
          go version -m dist/jiejie-masque-linux-amd64 | tee /tmp/modules.txt
          if grep -E 'github.com/quic-go/(quic-go|masque-go|qpack)' /tmp/modules.txt; then exit 1; fi
          if [ "$bytes" -ge $((64 * 1024 * 1024)) ]; then exit 1; fi

      - name: Stage systemd executables
        run: |
          sudo install -Dm755 dist/jiejie-masque-linux-amd64 /usr/local/bin/jiejie-masque
          sudo install -Dm755 contrib/jiejie-masque-connect-ip-network-prepare /usr/local/libexec/jiejie-masque-connect-ip-network-prepare

      - name: Systemd unit check
        run: |
          systemd-analyze verify contrib/jiejie-masque-connect-ip.service
          systemd-analyze verify contrib/jiejie-masque-connect-udp.service

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum jiejie-masque-linux-amd64 > jiejie-masque-linux-amd64.sha256

      - name: Report artifact
        run: |
          stat -c 'size: %s bytes' dist/jiejie-masque-linux-amd64
          file dist/jiejie-masque-linux-amd64
          cat dist/jiejie-masque-linux-amd64.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: jiejie-masque-linux-amd64
          path: dist/jiejie-masque-linux-amd64
          if-no-files-found: error

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: jiejie-masque-linux-amd64.sha256
          path: dist/jiejie-masque-linux-amd64.sha256
          if-no-files-found: error
